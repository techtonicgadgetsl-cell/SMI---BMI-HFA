<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMI BMI & HFA Tool</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 font-sans pb-10">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl sm:min-h-0 sm:mt-4 sm:rounded-2xl overflow-hidden">

        <div class="bg-blue-600 text-white p-4 text-center shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">SMI - BMI & HFA</h1>
            <button id="clear-btn" class="bg-white text-blue-600 px-3 py-1 rounded font-bold text-sm shadow">Clear</button>
        </div>

        <div class="p-4">
            <!-- Gender -->
            <div class="flex gap-3 mb-4">
                <button id="btn-boy" class="flex-1 py-2.5 text-md font-bold rounded-xl border-2 border-blue-500 bg-blue-500 text-white shadow-sm">පිරිමි (Boy)</button>
                <button id="btn-girl" class="flex-1 py-2.5 text-md font-bold rounded-xl border-2 border-gray-200 bg-gray-50 text-gray-500">ගැහැණු (Girl)</button>
            </div>

            <!-- Grade -->
            <label class="block text-gray-700 text-sm font-bold mb-1">ශ්‍රේණිය (Grade)</label>
            <select id="grade" class="w-full mb-4 px-3 py-2.5 rounded-xl border border-gray-300 bg-gray-50 text-lg font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="other" selected>Other / වෙනත්</option>
                <option value="1">Grade 01</option>
                <option value="2">Grade 02</option>
                <option value="3">Grade 03</option>
                <option value="4">Grade 04</option>
                <option value="5">Grade 05</option>
                <option value="6">Grade 06</option>
                <option value="7">Grade 07</option>
                <option value="8">Grade 08</option>
                <option value="9">Grade 09</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
                <option value="13">Grade 13</option>
            </select>

            <!-- DOB -->
            <label class="block text-gray-700 text-sm font-bold mb-1">උපන් දිනය (YYYY / MM / DD)</label>
            <div class="flex gap-2 items-center mb-4 bg-gray-50 p-2 rounded-xl border border-gray-300 shadow-inner">
                <input type="text" id="yy" maxlength="4" inputmode="numeric" class="w-full text-center bg-transparent focus:outline-none text-lg font-bold" placeholder="YYYY">
                <span class="text-gray-400 font-bold">/</span>
                <input type="text" id="mm" maxlength="2" inputmode="numeric" class="w-full text-center bg-transparent focus:outline-none text-lg font-bold" placeholder="MM">
                <span class="text-gray-400 font-bold">/</span>
                <input type="text" id="dd" maxlength="2" inputmode="numeric" class="w-full text-center bg-transparent focus:outline-none text-lg font-bold" placeholder="DD">
            </div>

            <!-- Height & Weight -->
            <div class="flex gap-3 mb-4">
                <div class="flex-1">
                    <label class="block text-gray-700 text-sm font-bold mb-1">උස (cm)</label>
                    <input type="text" id="height" inputmode="decimal" maxlength="5" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg bg-gray-50 shadow-inner font-bold text-center" placeholder="115.5">
                </div>
                <div class="flex-1">
                    <label class="block text-gray-700 text-sm font-bold mb-1">බර (kg)</label>
                    <input type="text" id="weight" inputmode="decimal" maxlength="5" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg bg-gray-50 shadow-inner font-bold text-center" placeholder="20.5">
                </div>
            </div>

            <div id="msg" class="hidden mb-3 p-2 rounded-lg bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm font-bold text-center"></div>

            <!-- Results -->
            <div id="results-section" class="hidden border-t-2 border-gray-100 pt-4 mt-2">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-blue-50 p-2 rounded-xl text-center border border-blue-100">
                        <span class="block text-[10px] text-blue-600 font-bold uppercase">වයස (මාස)</span>
                        <span id="res-age" class="font-bold text-lg text-gray-800">-</span>
                    </div>
                    <div class="bg-blue-50 p-2 rounded-xl text-center border border-blue-100">
                        <span class="block text-[10px] text-blue-600 font-bold uppercase">BMI</span>
                        <span id="res-bmi" class="font-bold text-lg text-gray-800">-</span>
                    </div>
                </div>

                <div id="status-container" class="mb-4 space-y-2"></div>

                <button id="toggle-graphs" class="w-full py-2 bg-gray-200 text-gray-700 font-bold rounded-lg text-sm mb-4">📊 ප්‍රස්තාර පෙන්වන්න / සඟවන්න</button>

                <div id="graphs-container" class="hidden space-y-4">
                    <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-center font-bold text-gray-700 mb-1 text-[11px] uppercase">Height for Age (උස)</h2>
                        <canvas id="chart-hfa" height="200"></canvas>
                    </div>
                    <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-center font-bold text-gray-700 mb-1 text-[11px] uppercase">BMI for Age (බර)</h2>
                        <canvas id="chart-bmi" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="who_data_2.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered!', reg))
                .catch(err => console.log('Service Worker Failed!', err));
        }
    </script>
</body>
</html>
